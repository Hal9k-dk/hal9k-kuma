# this is required to proxy Grafana Live WebSocket connections.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name status.belunktum.dk;
    ssl_certificate /etc/letsencrypt/live/belunktum.dk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/belunktum.dk/privkey.pem;
    include headers.conf;
    location ~ \{\{ {
        deny all;
    }
    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
    }
    access_log /var/log/nginx/status.belunktum.dk/access.log;
    error_log /var/log/nginx/status.belunktum.dk/error.log;
}

