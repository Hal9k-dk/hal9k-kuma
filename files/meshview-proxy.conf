proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=meshview:10m max_size=1g inactive=1h;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name meshview.belunktum.dk;
    ssl_certificate /etc/letsencrypt/live/belunktum.dk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/belunktum.dk/privkey.pem;
    include headers.conf;

    allow 127.0.0.1;
    allow 10.0.0.0/8;
    deny all;

    location / {
        proxy_pass https://meshview.dk;
        proxy_ssl_server_name on;
        proxy_ssl_name meshview.dk;
        proxy_set_header Host meshview.dk;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;

        proxy_cache meshview;
        proxy_cache_valid 200 1s;
        proxy_cache_valid 204 1h;
        proxy_ignore_headers Cache-Control;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
    }

    access_log /var/log/nginx/meshview.belunktum.dk/access.log;
    error_log /var/log/nginx/meshview.belunktum.dk/error.log;
}

# vim: expandtab sw=4
